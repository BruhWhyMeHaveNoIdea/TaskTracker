{% extends 'base.html' %}
{% load static %}

{% block body %}
<div class="flex-1 min-h-screen">
    <div class="p-8">
        <div class="flex justify-between items-center border-b-2 border-border-aaaa rounded-b-sm pb-2 font-bold">
            <div class="text-3xl mb-6 flex gap-sm">
                <p class="">Добро пожаловать,</p>
                <p class="font-bold">{{user.first_name}} {{user.last_name}}</p>
            </div>
            <div class="flex gap-lg items-center justify-center">
                <div class="text-lg shadow-sm rounded-md">
                    <p class="font-bold" id="currentTime"></p>
                </div>
                <div class="text-lg cursor-pointer transition-opacity duration-200 hover:shadow-sm hover:text-text-error">
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="font-bold">Выйти</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="flex mx-3 my-4">
            <p class="">чета придумать</p>
        </div>
    </div>
</div>
{% endblock %}


{% block scripts %}
    <script src="{% static 'js/account/home.js' %}"></script>
{% endblock %}
